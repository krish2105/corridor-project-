[project]
name = "corridor"
version = "0.1.0"
description = "Mansarovar corridor junction intelligence — JDA TMC survey audit and analysis"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",          # used directly in 9 modules, not via pandas
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyarrow>=16.0",
    "tabulate>=0.10.0",
    "pyproj>=3.7.2",
    "matplotlib>=3.11.1",
    "scipy>=1.17.1",
    "opencv-python>=5.0.0.93",
    "shapely>=2.1.2",
    "torch>=2.2",           # used directly for device selection, not only via ultralytics
    "ultralytics>=8.4.126",
    "supervision>=0.30,<0.31",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
